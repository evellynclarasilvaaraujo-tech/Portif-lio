  <text x="400" y="347" fill="#aaa6b5" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">Digite sua senha</text>
  <circle cx="276" cy="382" r="7" fill="none" stroke="#aaa6b5" stroke-width="1.5"/>
  <path d="M272 382h8M276 378v8" stroke="#aaa6b5" stroke-width="1"/>
  <text x="291" y="386" fill="#777382" font-family="Arial,sans-serif" font-size="12">Li e concordo com os termos de uso</text>
  <rect x="260" y="405" width="280" height="42" rx="11" fill="url(#button)"/>
  <text x="400" y="432" fill="#fff" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">Entrar</text>
